[bdist_wheel]
universal = 1

[metadata]
name = primes
version = attr: primes.__version__
description = library about prime numbers
long_description = file:README.md
license = MIT
author = shidocchi
author_email = shidocchi@gmail.com
url = https://github.com/shidocchi/primes
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Operating System :: OS Independent
    License :: OSI Approved :: MIT License
    Topic :: Utilities
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
py_modules = primes
install_requires =
    more_itertools >= 10.7
